name: widget
description: Genera un widget Flutter (StatelessWidget o StatefulWidget).
version: 1.0.0
vars:
  name:
    type: string
    description: Nombre del widget en snake_case
    prompt: "Nombre del widget"
  package_name:
    type: string
    description: Nombre del paquete (de pubspec.yaml)
  is_stateful:
    type: boolean
    description: true para StatefulWidget, false para StatelessWidget
    default: false
  is_global:
    type: boolean
    description: true si es un widget global (core/widgets), false si es de módulo
    default: false
  parent_module:
    type: string
    description: Nombre del módulo padre (solo si is_global es false)
    default: ""
